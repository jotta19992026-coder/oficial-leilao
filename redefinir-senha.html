<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova senha — Leilão Oficial</title>
  <meta name="description" content="Crie uma nova senha para sua conta.">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="favicon.png?v=81">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=81">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://srxtmyhcfncscjvyibhg.supabase.co" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="css/styles.css?v=81">
</head>
<body>
  <div id="site-header"></div>

  <div class="container authwrap">
    <div class="card">
      <h1>Criar nova senha</h1>
      <form id="form-reset" novalidate>
        <p class="muted">Digite a nova senha da sua conta.</p>
        <div class="field"><label for="reset-pass">Nova senha</label><input id="reset-pass" type="password" autocomplete="new-password" minlength="6" required></div>
        <div class="field"><label for="reset-pass2">Repita a nova senha</label><input id="reset-pass2" type="password" autocomplete="new-password" minlength="6" required></div>
        <button class="btn btn--primary btn--block" type="submit">Salvar nova senha</button>
        <p class="form__msg" id="reset-msg" role="status"></p>
      </form>
      <div id="reset-expired" hidden>
        <p class="form__msg form__msg--err">Este link de recuperação é inválido, expirou ou já foi usado.</p>
        <p class="muted">Peça um novo link na tela de login, em "Esqueci minha senha". O link vale por 1 hora e só pode ser usado uma vez.</p>
        <a class="btn btn--primary btn--block" href="login.html">Ir para o login</a>
      </div>
    </div>
  </div>

  <div id="site-footer"></div>

  <script src="js/data.js?v=81"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/supabase.js?v=81"></script>
  <script src="js/auth.js?v=81"></script>
  <script src="js/site.js?v=81"></script>
  <script src="js/recover.js?v=81"></script>
</body>
</html>
