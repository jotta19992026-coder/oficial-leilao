<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 297" width="1140" height="297">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a2e"/>
      <stop offset="50%" stop-color="#1a0d4a"/>
      <stop offset="100%" stop-color="#0d2a6b"/>
    </linearGradient>
    <linearGradient id="bldFill" x1="0%" y1="0%" x2="0%" y2="100%">
