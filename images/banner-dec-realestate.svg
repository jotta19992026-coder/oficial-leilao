<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 297" width="1140" height="297">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2548"/>
      <stop offset="50%" stop-color="#0d3d6b"/>
      <stop offset="100%" stop-color="#0e5240"/>
    </linearGradient>
    <linearGradient id="houseFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a6b4a"/>
      <stop offset="100%" stop-color="#0d4a30"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#12a06a"/>
      <stop offset="100%" stop-color="#16c47e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1140" height="297" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.06" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="74" x2="1140" y2="74"/>
    <line x1="0" y1="148" x2="1140" y2="148"/>
    <line x1="0" y1="222" x2="1140" y2="222"/>
    <line x1="285" y1="0" x2="285" y2="297"/>
    <line x1="570" y1="0" x2="570" y2="297"/>
    <line x1="855" y1="0" x2="855" y2="297"/>
  </g>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="6" height="297" fill="url(#accent)"/>

  <!-- === TEXT AREA === -->
  <!-- Label chip -->
  <rect x="48" y="38" width="220" height="26" rx="13" fill="#12a06a" opacity="0.25"/>
  <text x="158" y="55.5" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#12a06a" text-anchor="middle" letter-spacing="2">DECEMBER REAL ESTATE AUCTION</text>

  <!-- Main title -->
  <text x="48" y="110" font-family="Arial Black, Arial, sans-serif" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="-1">Leilão de Imóveis</text>
  <text x="48" y="150" font-family="Arial Black, Arial, sans-serif" font-size="38" font-weight="900" fill="#12a06a" letter-spacing="-1">Dezembro 2026</text>

  <!-- Subtitle -->
  <text x="48" y="186" font-family="Arial, sans-serif" font-size="14.5" fill="#b0cce0">Apartamentos, casas e imóveis comerciais disponíveis para arrematação.</text>
  <text x="48" y="204" font-family="Arial, sans-serif" font-size="14.5" fill="#b0cce0">Lances 100% online — 15/12 e 20/12 às 10h.</text>

  <!-- CTA button -->
  <rect x="48" y="225" width="160" height="40" rx="8" fill="url(#accent)"/>
  <text x="128" y="250" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Ver imóveis →</text>

  <!-- Date badges -->
  <rect x="48" y="272" width="80" height="20" rx="4" fill="#ffffff" opacity="0.12"/>
  <text x="88" y="285.5" font-family="Arial, sans-serif" font-size="11" fill="#fff" text-anchor="middle">15 Dez · 10h</text>
  <rect x="138" y="272" width="80" height="20" rx="4" fill="#ffffff" opacity="0.12"/>
  <text x="178" y="285.5" font-family="Arial, sans-serif" font-size="11" fill="#fff" text-anchor="middle">20 Dez · 10h</text>

  <!-- === ILLUSTRATION AREA (right half) === -->
  <!-- Sky circle glow -->
  <circle cx="870" cy="148" r="200" fill="#0e5240" opacity="0.4"/>
  <circle cx="870" cy="148" r="140" fill="#12a06a" opacity="0.08"/>

  <!-- House 1 (large, center) -->
  <g transform="translate(770, 60)">
    <!-- Roof -->
    <polygon points="100,0 0,80 200,80" fill="#16c47e" opacity="0.9"/>
    <!-- Walls -->
    <rect x="20" y="80" width="160" height="120" fill="url(#houseFill)"/>
    <!-- Door -->
    <rect x="80" y="140" width="40" height="60" rx="4" fill="#0a2548"/>
    <!-- Windows -->
    <rect x="30" y="95" width="40" height="35" rx="3" fill="#12a06a" opacity="0.5"/>
    <rect x="130" y="95" width="40" height="35" rx="3" fill="#12a06a" opacity="0.5"/>
    <!-- Window cross lines -->
    <line x1="50" y1="95" x2="50" y2="130" stroke="#0a2548" stroke-width="1.5"/>
    <line x1="30" y1="112" x2="70" y2="112" stroke="#0a2548" stroke-width="1.5"/>
    <line x1="150" y1="95" x2="150" y2="130" stroke="#0a2548" stroke-width="1.5"/>
    <line x1="130" y1="112" x2="170" y2="112" stroke="#0a2548" stroke-width="1.5"/>
    <!-- Chimney -->
    <rect x="140" y="-15" width="22" height="40" fill="#0d4a30"/>
    <rect x="136" y="-18" width="30" height="8" fill="#12a06a"/>
  </g>

  <!-- House 2 (smaller, left bg) -->
  <g transform="translate(680, 100)">
    <polygon points="65,0 0,55 130,55" fill="#0d9e5a" opacity="0.7"/>
    <rect x="12" y="55" width="106" height="90" fill="#0a4530" opacity="0.8"/>
    <rect x="40" y="100" width="30" height="45" rx="3" fill="#0a2548" opacity="0.9"/>
    <rect x="18" y="65" width="28" height="24" rx="2" fill="#12a06a" opacity="0.4"/>
    <rect x="84" y="65" width="28" height="24" rx="2" fill="#12a06a" opacity="0.4"/>
  </g>

  <!-- House 3 (smaller, right bg) -->
  <g transform="translate(990, 115)">
    <polygon points="60,0 0,50 120,50" fill="#0d9e5a" opacity="0.7"/>
    <rect x="10" y="50" width="100" height="80" fill="#0a4530" opacity="0.8"/>
    <rect x="38" y="90" width="24" height="40" rx="3" fill="#0a2548" opacity="0.9"/>
    <rect x="15" y="60" width="25" height="20" rx="2" fill="#12a06a" opacity="0.4"/>
    <rect x="80" y="60" width="25" height="20" rx="2" fill="#12a06a" opacity="0.4"/>
  </g>

  <!-- Ground line -->
  <rect x="620" y="200" width="460" height="4" rx="2" fill="#12a06a" opacity="0.5"/>
  <rect x="620" y="204" width="460" height="90" fill="#0a3d2e" opacity="0.3"/>

  <!-- Floating price tag -->
  <g transform="translate(915, 48)">
    <rect width="140" height="52" rx="10" fill="#ffffff" opacity="0.95"/>
    <text x="70" y="20" font-family="Arial, sans-serif" font-size="10" fill="#0a2548" text-anchor="middle" font-weight="600">A PARTIR DE</text>
    <text x="70" y="40" font-family="Arial Black, Arial, sans-serif" font-size="18" fill="#12a06a" text-anchor="middle" font-weight="900">R$ 85.000</text>
  </g>

  <!-- Stars/sparkles -->
  <circle cx="650" cy="45" r="3" fill="#16c47e" opacity="0.6"/>
  <circle cx="1100" cy="90" r="2" fill="#16c47e" opacity="0.5"/>
  <circle cx="1080" cy="40" r="4" fill="#12a06a" opacity="0.4"/>
  <circle cx="660" cy="180" r="2.5" fill="#16c47e" opacity="0.5"/>
</svg>
