<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — Leilão Oficial</title>
  <meta name="description" content="Acesse sua conta no Leilão Oficial.">
  <link rel="icon" type="image/png" href="favicon.png?v=44">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=44">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://srxtmyhcfncscjvyibhg.supabase.co" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="css/styles.css?v=44">
</head>
<body>
  <div id="site-header"></div>

  <div class="container authwrap">
    <div class="card">
      <h1>Entrar</h1>
      <p class="muted">Acesse sua conta para dar lances e acompanhar leilões.</p>
      <form id="form-login" novalidate>
        <div class="field"><label for="login-email">E-mail</label><input id="login-email" type="email" autocomplete="username" required></div>
        <div class="field"><label for="login-pass">Senha</label><input id="login-pass" type="password" autocomplete="current-password" required></div>
        <button class="btn btn--primary btn--block" type="submit">Entrar</button>
        <p class="form__msg" id="login-msg"></p>
      </form>
      <p class="form__alt">Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
    </div>
  </div>

  <div id="site-footer"></div>

  <script src="js/data.js?v=44"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/supabase.js?v=44"></script>
  <script src="js/auth.js?v=44"></script>
  <script src="js/site.js?v=44"></script>
  <script src="js/forms.js?v=44"></script>
</body>
</html>
