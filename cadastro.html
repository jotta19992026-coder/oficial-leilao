<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro — Leilão Oficial</title>
  <meta name="description" content="Crie sua conta no Leilão Oficial.">
  <link rel="icon" type="image/png" href="favicon.png?v=44">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=44">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://srxtmyhcfncscjvyibhg.supabase.co" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="css/styles.css?v=44">
</head>
<body>
  <div id="site-header"></div>

  <div class="container authwrap">
    <div class="card">
      <h1>Criar conta</h1>
      <p class="muted">Leva menos de um minuto.</p>
      <form id="form-signup" novalidate>
        <div class="field"><label for="signup-name">Nome completo</label><input id="signup-name" autocomplete="name" required></div>
        <div class="field"><label for="signup-email">E-mail</label><input id="signup-email" type="email" autocomplete="username" required></div>
        <div class="grid-2">
          <div class="field"><label for="signup-cpf">CPF</label><input id="signup-cpf" data-mask="cpf" inputmode="numeric" autocomplete="off" placeholder="000.000.000-00" required></div>
          <div class="field"><label for="signup-phone">Telefone / WhatsApp</label><input id="signup-phone" data-mask="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="(00) 00000-0000" required></div>
        </div>
        <div class="field"><label for="signup-address">Endereço <span class="muted">(opcional)</span></label><input id="signup-address" autocomplete="street-address" placeholder="Rua, nº, bairro, cidade/UF"></div>
        <div class="field"><label for="signup-pass">Senha</label><input id="signup-pass" type="password" autocomplete="new-password" required minlength="6"></div>
        <div class="field"><label for="signup-pass2">Confirmar senha</label><input id="signup-pass2" type="password" autocomplete="new-password" required></div>
        <button class="btn btn--primary btn--block" type="submit">Criar conta</button>
        <p class="form__msg" id="signup-msg"></p>
      </form>
      <p class="form__alt">Já tem conta? <a href="login.html">Entrar</a></p>
    </div>
  </div>

  <div id="site-footer"></div>

  <script src="js/data.js?v=44"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/supabase.js?v=44"></script>
  <script src="js/auth.js?v=44"></script>
  <script src="js/site.js?v=44"></script>
  <script src="js/masks.js?v=44"></script>
  <script src="js/forms.js?v=44"></script>
</body>
</html>
