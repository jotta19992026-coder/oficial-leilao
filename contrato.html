<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="robots" content="noindex">

  <script>try{if(!localStorage.getItem('sb-srxtmyhcfncscjvyibhg-auth-token'))location.replace('admin-login.html');}catch(e){location.replace('admin-login.html');}</script>
  <link rel="icon" type="image/png" href="favicon.png?v=46">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=46">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://srxtmyhcfncscjvyibhg.supabase.co" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="css/styles.css?v=46">
</head>
<body>
  <div id="site-header"></div>

  <div class="pagehead"><div class="container"><h1>Contrato de arrematação</h1><p>Gere o contrato automaticamente com os dados do arrematante.</p></div></div>

  <section class="section">
    <div class="container" style="max-width:860px">

      <form id="contract-form" class="card" style="margin-bottom:1.6rem">
        <h2 style="margin-top:0;color:var(--navy);font-size:1.2rem">Dados do arrematante</h2>
        <div class="grid-2">
          <div class="field"><label for="c-nome">Nome completo</label><input id="c-nome" required></div>
          <div class="field"><label for="c-cpf">CPF/CNPJ</label><input id="c-cpf" data-mask="cpf" inputmode="numeric" placeholder="000.000.000-00"></div>
        </div>
        <div class="grid-2">
          <div class="field"><label for="c-email">E-mail</label><input id="c-email" type="email"></div>
          <div class="field"><label for="c-tel">Telefone</label><input id="c-tel" data-mask="phone" type="tel" inputmode="tel" placeholder="(00) 00000-0000"></div>
        </div>
        <div class="field"><label for="c-endereco">Endereço</label><input id="c-endereco" placeholder="Rua, nº, bairro, cidade/UF"></div>
        <h2 style="color:var(--navy);font-size:1.2rem">Lote arrematado</h2>
        <div class="grid-2">
          <div class="field"><label for="c-lote">Lote</label><select id="c-lote"></select></div>
          <div class="field"><label for="c-valor">Valor de arremate (R$)</label><input id="c-valor" type="number" min="0"></div>
        </div>
        <button class="btn btn--primary" type="submit">Gerar contrato</button>
      </form>

      <div id="contract-output"></div>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="js/data.js?v=46"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/supabase.js?v=46"></script>
  <script src="js/auth.js?v=46"></script>
  <script src="js/store.js?v=46"></script>
  <script src="js/site.js?v=46"></script>
  <script src="js/masks.js?v=46"></script>
  <script src="js/contract.js?v=46"></script>
  <script src="js/contrato.js?v=46"></script>
</body>
</html>
